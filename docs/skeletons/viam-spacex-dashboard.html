<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viam Reference Ops Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --md-sys-color-background: #030507;
      --md-sys-color-on-background: #f3f7fb;
      --md-sys-color-surface: #080d12;
      --md-sys-color-surface-container-low: #0d1319;
      --md-sys-color-surface-container: #111820;
      --md-sys-color-surface-container-high: #17202a;
      --md-sys-color-on-surface: #edf2f7;
      --md-sys-color-on-surface-variant: #aeb8c4;
      --md-sys-color-outline: #293543;
      --md-sys-color-outline-variant: #1c2530;
      --md-sys-color-primary: #8be7ff;
      --md-sys-color-on-primary: #001f2a;
      --md-sys-color-primary-container: #12313c;
      --md-sys-color-secondary: #d7e1ea;
      --md-sys-color-secondary-container: #242c34;
      --md-sys-color-tertiary: #ffb45f;
      --md-sys-color-error: #ff687e;
      --md-sys-color-success: #4fe3a4;
      --md-sys-color-warning: #ffd166;
      --md-sys-state-hover-opacity: 0.08;
      --md-sys-state-focus-opacity: 0.12;
      --shape-xs: 4px;
      --shape-sm: 6px;
      --shape-md: 8px;
      --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.36), 0 0 0 1px rgba(255, 255, 255, 0.03);
      --elevation-2: 0 8px 24px rgba(0, 0, 0, 0.32), 0 0 0 1px rgba(255, 255, 255, 0.04);
      --track: rgba(139, 231, 255, 0.2);
      --steel: #6d7b88;
      --panel-pad: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--md-sys-color-background);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--md-sys-color-on-background);
      font-family: Roboto, Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.022) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
        linear-gradient(160deg, #020406 0%, #070a0d 46%, #0b0e10 100%);
      background-size: 48px 48px, 48px 48px, auto;
    }

    button,
    input {
      font: inherit;
    }

    viam-dashboard {
      display: block;
      min-height: 100vh;
    }

    .material-symbols-rounded {
      display: inline-flex;
      width: 1em;
      height: 1em;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      direction: ltr;
      font-family: "Material Symbols Rounded";
      font-feature-settings: "liga";
      font-size: 20px;
      font-style: normal;
      font-weight: 450;
      letter-spacing: normal;
      line-height: 1;
      text-transform: none;
      white-space: nowrap;
      word-wrap: normal;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: grid;
      min-height: 100vh;
      grid-template-columns: 60px minmax(0, 1fr);
      grid-template-rows: 56px minmax(0, 1fr);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      min-width: 0;
      grid-column: 1 / -1;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      background: rgba(3, 5, 7, 0.9);
      backdrop-filter: blur(18px);
      padding: 0 14px;
    }

    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(139, 231, 255, 0.46);
      border-radius: var(--shape-sm);
      background:
        linear-gradient(135deg, rgba(139, 231, 255, 0.18), rgba(255, 255, 255, 0.02)),
        #060a0e;
      box-shadow: inset 0 0 18px rgba(139, 231, 255, 0.08);
      color: var(--md-sys-color-primary);
      font-weight: 700;
    }

    .brand-meta {
      display: grid;
      min-width: 142px;
      line-height: 1.15;
    }

    .brand-meta strong,
    .section-title strong,
    .card-title strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .brand-meta small,
    .section-title span,
    .card-title span,
    .muted {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px;
    }

    .status-pill {
      display: inline-flex;
      height: 28px;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(79, 227, 164, 0.32);
      border-radius: 999px;
      background: rgba(79, 227, 164, 0.08);
      color: var(--md-sys-color-success);
      padding: 0 10px;
      white-space: nowrap;
    }

    .topbar-spacer {
      flex: 1 1 auto;
      min-width: 8px;
    }

    .search {
      display: flex;
      width: min(320px, 28vw);
      min-width: 180px;
      height: 36px;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-md);
      background: rgba(255, 255, 255, 0.035);
      color: var(--md-sys-color-on-surface-variant);
      padding: 0 10px;
    }

    .search input {
      min-width: 0;
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--md-sys-color-on-surface);
    }

    .icon-button {
      position: relative;
      display: inline-grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      border: 0;
      border-radius: var(--shape-md);
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
    }

    .icon-button::before,
    .rail-button::before,
    .command-button::before {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: currentColor;
      content: "";
      opacity: 0;
      transition: opacity 160ms ease;
    }

    .icon-button:hover::before,
    .rail-button:hover::before,
    .command-button:hover::before {
      opacity: var(--md-sys-state-hover-opacity);
    }

    .icon-button > *,
    .rail-button > *,
    .command-button > * {
      position: relative;
    }

    .rail {
      display: flex;
      grid-row: 2;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border-right: 1px solid var(--md-sys-color-outline-variant);
      background: rgba(5, 8, 11, 0.72);
      padding: 10px 8px;
    }

    .rail-button {
      position: relative;
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border: 0;
      border-radius: var(--shape-md);
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
    }

    .rail-button.active {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
    }

    .content {
      min-width: 0;
      grid-column: 2;
      grid-row: 2;
      padding: 12px;
    }

    .dashboard-frame {
      display: grid;
      max-width: 1560px;
      margin: 0 auto;
      gap: 12px;
    }

    .section-bar {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .section-title strong {
      font-size: 18px;
      font-weight: 700;
    }

    .section-actions {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .edit-toggle {
      display: inline-flex;
      height: 34px;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-md);
      background: rgba(255, 255, 255, 0.028);
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      font-weight: 500;
      padding: 0 10px;
      user-select: none;
      white-space: nowrap;
    }

    .edit-toggle input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .switch-track {
      position: relative;
      display: inline-flex;
      width: 34px;
      height: 20px;
      align-items: center;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 999px;
      background: var(--md-sys-color-surface-container-high);
      transition: background 160ms ease, border-color 160ms ease;
    }

    .switch-track::after {
      position: absolute;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--md-sys-color-on-surface-variant);
      content: "";
      transition: transform 180ms ease, background 160ms ease;
    }

    .edit-toggle input:checked + .switch-track {
      border-color: rgba(139, 231, 255, 0.54);
      background: var(--md-sys-color-primary-container);
    }

    .edit-toggle input:checked + .switch-track::after {
      background: var(--md-sys-color-primary);
      transform: translateX(14px);
    }

    .tile-add-form {
      display: none;
      height: 34px;
      align-items: center;
      gap: 6px;
    }

    .dashboard-frame[data-editing="true"] .tile-add-form {
      display: inline-flex;
    }

    .select-field {
      height: 34px;
      min-width: 184px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-md);
      outline: 0;
      background: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface);
      padding: 0 30px 0 10px;
    }

    .segmented {
      display: inline-grid;
      height: 34px;
      grid-template-columns: repeat(3, minmax(64px, 1fr));
      overflow: hidden;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-md);
      background: rgba(255, 255, 255, 0.028);
    }

    .segment {
      border: 0;
      border-left: 1px solid var(--md-sys-color-outline-variant);
      background: transparent;
      color: var(--md-sys-color-on-surface-variant);
      padding: 0 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .segment:first-child {
      border-left: 0;
    }

    .segment.active {
      background: rgba(139, 231, 255, 0.14);
      color: var(--md-sys-color-primary);
      font-weight: 500;
    }

    .metric-strip {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 10px;
    }

    viam-tile-board,
    viam-metric-card,
    viam-chart-card,
    viam-fleet-table,
    viam-command-center,
    viam-event-stream,
    viam-site-map {
      display: block;
      min-width: 0;
    }

    .tile-board {
      display: grid;
      grid-auto-flow: dense;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 10px;
    }

    .dashboard-tile {
      position: relative;
      min-width: 0;
      grid-column: span var(--tile-cols, 4);
      transition: grid-column 180ms ease, transform 160ms ease, box-shadow 160ms ease;
    }

    .dashboard-tile[data-size="mini"] {
      --tile-cols: 2;
    }

    .dashboard-tile[data-size="small"] {
      --tile-cols: 3;
    }

    .dashboard-tile[data-size="medium"] {
      --tile-cols: 4;
    }

    .dashboard-tile[data-size="large"] {
      --tile-cols: 6;
    }

    .dashboard-tile[data-size="wide"] {
      --tile-cols: 8;
    }

    .dashboard-tile[data-size="full"] {
      --tile-cols: 12;
    }

    .dashboard-tile > viam-metric-card,
    .dashboard-tile > viam-chart-card,
    .dashboard-tile > viam-fleet-table,
    .dashboard-tile > viam-command-center,
    .dashboard-tile > viam-site-map,
    .dashboard-tile > viam-event-stream {
      height: 100%;
    }

    .dashboard-tile .md-card {
      height: 100%;
    }

    .dashboard-frame[data-editing="true"] .dashboard-tile {
      padding-top: 34px;
    }

    .dashboard-frame[data-editing="true"] .dashboard-tile::before {
      position: absolute;
      inset: 30px -3px -3px;
      border: 1px dashed rgba(139, 231, 255, 0.38);
      border-radius: calc(var(--shape-md) + 3px);
      content: "";
      pointer-events: none;
    }

    .tile-edit-controls {
      position: absolute;
      top: 0;
      right: 0;
      z-index: 2;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .dashboard-frame[data-editing="true"] .tile-edit-controls {
      display: inline-flex;
    }

    .tile-size-select {
      width: 94px;
      height: 28px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-sm);
      outline: 0;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font-size: 11px;
      padding: 0 6px;
    }

    .tile-control {
      position: relative;
      display: inline-grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-sm);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      cursor: pointer;
    }

    .tile-control.danger {
      color: var(--md-sys-color-error);
    }

    .tile-control .material-symbols-rounded {
      font-size: 17px;
    }

    .md-card {
      overflow: hidden;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-md);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0)),
        var(--md-sys-color-surface-container-low);
      box-shadow: var(--elevation-1);
    }

    .metric-card {
      display: grid;
      min-height: 86px;
      grid-template-columns: minmax(0, 1fr) 36px;
      gap: 8px;
      padding: 11px 12px;
    }

    .metric-copy {
      display: grid;
      min-width: 0;
      gap: 5px;
    }

    .metric-label {
      overflow: hidden;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .metric-value {
      overflow: hidden;
      color: var(--md-sys-color-on-surface);
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .metric-trend {
      display: inline-flex;
      width: fit-content;
      max-width: 100%;
      align-items: center;
      gap: 4px;
      color: var(--trend-color, var(--md-sys-color-primary));
      font-size: 11px;
      white-space: nowrap;
    }

    .metric-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: var(--shape-sm);
      background: var(--icon-bg, rgba(139, 231, 255, 0.12));
      color: var(--icon-color, var(--md-sys-color-primary));
    }

    .ops-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(360px, 0.75fr);
      gap: 12px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    viam-chart-card[span="wide"] {
      grid-column: 1 / -1;
    }

    .card-header {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      padding: 10px 12px 8px;
    }

    .card-title {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .card-title strong {
      font-size: 13px;
      font-weight: 700;
    }

    .chart-body {
      height: 220px;
      padding: 10px 12px 12px;
    }

    viam-chart-card[height="compact"] .chart-body {
      height: 174px;
    }

    .dashboard-tile[data-size="small"] .chart-body,
    .dashboard-tile[data-size="medium"] .chart-body {
      height: 174px;
    }

    .dashboard-tile[data-size="wide"] .chart-body {
      height: 240px;
    }

    .dashboard-tile[data-size="full"] .chart-body {
      height: 280px;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .side-stack {
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .table-card {
      padding: 0;
    }

    .fleet-list {
      display: grid;
    }

    .fleet-row {
      display: grid;
      min-width: 0;
      grid-template-columns: 24px minmax(108px, 1fr) 74px 62px 58px;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding: 8px 12px;
    }

    .fleet-row:first-child {
      border-top: 0;
    }

    .fleet-unit {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .fleet-unit strong,
    .event-copy strong {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fleet-unit span,
    .event-copy span {
      overflow: hidden;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--dot, var(--md-sys-color-primary));
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--dot, var(--md-sys-color-primary)) 15%, transparent);
    }

    .fleet-cell {
      overflow: hidden;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-chip {
      display: inline-flex;
      min-width: 54px;
      height: 24px;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--chip-color) 38%, transparent);
      border-radius: 999px;
      background: color-mix(in srgb, var(--chip-color) 12%, transparent);
      color: var(--chip-color);
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    .command-card {
      padding: 12px;
    }

    .command-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .command-button {
      position: relative;
      display: grid;
      min-height: 60px;
      place-items: center;
      gap: 5px;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-md);
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-surface);
      cursor: pointer;
      padding: 8px;
      text-align: center;
    }

    .command-button .material-symbols-rounded {
      color: var(--cmd-color, var(--md-sys-color-primary));
      font-size: 22px;
    }

    .command-button span:last-child {
      max-width: 100%;
      overflow: hidden;
      font-size: 11px;
      font-weight: 500;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-footer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding-top: 10px;
    }

    .key-value {
      display: grid;
      min-width: 0;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .kv {
      min-width: 0;
    }

    .kv span {
      display: block;
      overflow: hidden;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 10px;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .kv strong {
      display: block;
      overflow: hidden;
      color: var(--md-sys-color-on-surface);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filled-tonal {
      display: inline-flex;
      height: 34px;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: var(--shape-md);
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-primary);
      cursor: pointer;
      font-weight: 500;
      padding: 0 12px;
      white-space: nowrap;
    }

    .map-card {
      min-height: 234px;
      padding: 12px;
    }

    .site-map {
      position: relative;
      height: 184px;
      overflow: hidden;
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--shape-md);
      background:
        linear-gradient(90deg, rgba(139, 231, 255, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(139, 231, 255, 0.06) 1px, transparent 1px),
        linear-gradient(135deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.01));
      background-size: 24px 24px, 24px 24px, auto;
    }

    .map-orbit {
      position: absolute;
      inset: 22px 28px;
      border: 1px solid rgba(139, 231, 255, 0.36);
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    .map-lane {
      position: absolute;
      height: 1px;
      background: rgba(255, 255, 255, 0.16);
      transform-origin: left center;
    }

    .map-lane.one {
      left: 22px;
      right: 28px;
      top: 64px;
      transform: rotate(8deg);
    }

    .map-lane.two {
      left: 38px;
      right: 18px;
      bottom: 52px;
      transform: rotate(-7deg);
    }

    .map-node {
      position: absolute;
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--node-color) 46%, transparent);
      border-radius: 50%;
      background: color-mix(in srgb, var(--node-color) 14%, #05080b);
      color: var(--node-color);
      box-shadow: 0 0 24px color-mix(in srgb, var(--node-color) 26%, transparent);
    }

    .map-node .material-symbols-rounded {
      font-size: 16px;
    }

    .event-card {
      padding-bottom: 4px;
    }

    .event-list {
      display: grid;
    }

    .event-row {
      display: grid;
      min-width: 0;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding: 9px 12px;
    }

    .event-row:first-child {
      border-top: 0;
    }

    .event-icon {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: var(--shape-sm);
      background: color-mix(in srgb, var(--event-color) 14%, transparent);
      color: var(--event-color);
    }

    .event-icon .material-symbols-rounded {
      font-size: 17px;
    }

    .event-time {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 11px;
      white-space: nowrap;
    }

    @media (max-width: 1160px) {
      .tile-board {
        grid-template-columns: repeat(8, minmax(0, 1fr));
      }

      .dashboard-tile[data-size="wide"],
      .dashboard-tile[data-size="full"] {
        grid-column: 1 / -1;
      }

      .dashboard-tile[data-size="large"] {
        --tile-cols: 4;
      }

      .metric-strip {
        grid-template-columns: repeat(3, minmax(140px, 1fr));
      }

      .ops-grid {
        grid-template-columns: 1fr;
      }

      .side-stack {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 820px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .rail {
        display: none;
      }

      .content {
        grid-column: 1;
        padding: 10px;
      }

      .tile-board {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .dashboard-tile[data-size="small"],
      .dashboard-tile[data-size="medium"],
      .dashboard-tile[data-size="large"],
      .dashboard-tile[data-size="wide"],
      .dashboard-tile[data-size="full"] {
        grid-column: 1 / -1;
      }

      .topbar {
        gap: 8px;
        padding: 0 10px;
      }

      .search {
        display: none;
      }

      .metric-strip,
      .charts-grid,
      .side-stack {
        grid-template-columns: 1fr;
      }

      .section-bar {
        align-items: flex-start;
        flex-direction: column;
      }

      .section-actions {
        width: 100%;
        justify-content: space-between;
      }

      .tile-add-form {
        width: 100%;
      }

      .tile-add-form .select-field {
        flex: 1 1 auto;
        min-width: 0;
      }

      .segmented {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
      }

      .fleet-row {
        grid-template-columns: 20px minmax(94px, 1fr) 60px 50px;
      }

      .fleet-cell.temp {
        display: none;
      }
    }

    @media (max-width: 560px) {
      .brand-meta small,
      .status-pill,
      .topbar .icon-button:nth-last-child(2) {
        display: none;
      }

      .metric-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tile-board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-tile {
        grid-column: 1 / -1;
      }

      .dashboard-tile[data-size="mini"] {
        grid-column: span 1;
      }

      .metric-card {
        min-height: 78px;
        grid-template-columns: minmax(0, 1fr);
      }

      .metric-icon {
        display: none;
      }

      .command-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .command-footer,
      .key-value {
        grid-template-columns: 1fr;
      }
    }
  </style>

    const TILE_BY_TYPE = new Map(TILE_CATALOG.map((tile) => [tile.type, tile]));
    const INITIAL_TILES = [
      ["online-machines", "mini"],
      ["telemetry-ingest", "mini"],

    const createTile = (type, size) => {

    class ViamMetricCard extends HTMLElement {
      connectedCallback() {

    class ViamChartCard extends HTMLElement {
      connectedCallback() {
        this.innerHTML = `
          <article class="md-card">
            <header class="card-header">
              <div class="card-title">
                <strong>${this.getAttribute("title")}</strong>
                <span>${this.getAttribute("subtitle")}</span>
              </div>
              <button class="icon-button" type="button" title="Chart options" aria-label="Chart options">
                ${ICON("more_vert")}
              </button>
            </header>
            <div class="chart-body">
              <canvas aria-label="${this.getAttribute("title")} line chart" role="img"></canvas>
            </div>
          </article>
        `;

        requestAnimationFrame(() => this.renderChart());
      }

      disconnectedCallback() {
        this.chart?.destroy();
        this.chart = null;
      }

      resizeChart() {
        this.chart?.resize();
      }

      renderChart() {
        if (!window.Chart) {
          return;
        }

        Chart.defaults.font.family = "Roboto, Arial, sans-serif";
        Chart.defaults.color = "#aeb8c4";

        const canvas = this.querySelector("canvas");
        const context = canvas.getContext("2d");
        const type = this.getAttribute("data-chart") || "fleet";
        const source = chartData[type];
        const areaHeight = this.getAttribute("height") === "compact" ? 174 : 220;

        const datasets = source.datasets.map((series) => {
          const gradient = context.createLinearGradient(0, 0, 0, areaHeight);
          gradient.addColorStop(0, `${series.color}40`);
          gradient.addColorStop(0.6, `${series.color}12`);
          gradient.addColorStop(1, `${series.color}00`);

          return {
            label: series.label,
            data: series.values,
            borderColor: series.color,
            backgroundColor: gradient,
            borderWidth: 2,
            cubicInterpolationMode: "monotone",
            fill: true,
            pointRadius: 0,
            pointHoverRadius: 4,
            tension: 0.42,
          };
        });

        this.chart?.destroy();
        this.chart = new Chart(context, {
          type: "line",
          data: {
            labels: source.labels,
            datasets,
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: {
              duration: 900,
              easing: "easeOutQuart",
            },
            interaction: {
              intersect: false,
              mode: "index",
            },
            plugins: {
              legend: {
                align: "end",
                labels: {
                  boxHeight: 3,
                  boxWidth: 18,
                  color: "#c7d0da",
                  padding: 12,
                  usePointStyle: false,
                },
              },
              tooltip: {
                backgroundColor: "#101820",
                borderColor: "#293543",
                borderWidth: 1,
                displayColors: true,
                padding: 10,
                titleColor: "#f3f7fb",
                bodyColor: "#d7e1ea",
              },
            },
            scales: {
              x: {
                border: {
                  display: false,
                },
                grid: {
                  color: "rgba(255, 255, 255, 0.04)",
                  drawTicks: false,
                },
                ticks: {
                  color: "#8793a0",
                  maxRotation: 0,
                  padding: 8,
                },
              },
              y: {
                beginAtZero: false,
                border: {
                  display: false,
                },
                grid: {
                  color: "rgba(255, 255, 255, 0.055)",
                  drawTicks: false,
                },
                ticks: {
                  color: "#8793a0",
                  padding: 8,
                },
              },
            },
          },
        });
      }
    }

    class ViamTileBoard extends HTMLElement {
      constructor() {
        super();
        this.tiles = INITIAL_TILES.map(([type, size]) => createTile(type, size));
        this.onClick = this.onClick.bind(this);
        this.onChange = this.onChange.bind(this);
      }

      connectedCallback() {
        this.render();
        this.addEventListener("click", this.onClick);
        this.addEventListener("change", this.onChange);
        this.updateControlState();
      }

      disconnectedCallback() {
        this.removeEventListener("click", this.onClick);
        this.removeEventListener("change", this.onChange);
      }

      get editing() {
        return this.hasAttribute("editing");
      }

      set editing(value) {
        this.toggleAttribute("editing", Boolean(value));
        this.updateControlState();
      }

      addTile(type) {
        if (!this.editing) {
          return;
        }

        this.tiles = [...this.tiles, createTile(type)];
        this.render();
        this.resizeCharts();
      }

      onClick(event) {
        if (!this.editing) {
          return;
        }

        const removeButton = event.target.closest("[data-action='remove-tile']");
        if (!removeButton) {
          return;
        }

        const tile = removeButton.closest(".dashboard-tile");
        if (!tile || this.tiles.length <= 1) {
          return;
        }

        this.tiles = this.tiles.filter((item) => item.id !== tile.dataset.tileId);
        tile.remove();
        this.resizeCharts();
      }

      onChange(event) {
        if (!this.editing || !event.target.matches("[data-size-control]")) {
          return;
        }

        const tileElement = event.target.closest(".dashboard-tile");
        const tile = this.tiles.find((item) => item.id === tileElement?.dataset.tileId);
        if (!tile) {
          return;
        }

        tile.size = event.target.value;
        tileElement.dataset.size = tile.size;
        this.resizeCharts();
      }

      render() {
        this.innerHTML = `
          <section class="tile-board" aria-label="Editable dashboard tiles">
            ${this.tiles.map((tile) => this.renderTile(tile)).join("")}
          </section>
        `;
        this.updateControlState();
      }

      renderTile(tile) {
        const definition = TILE_BY_TYPE.get(tile.type) || TILE_CATALOG[0];
        const sizeOptions = TILE_SIZE_OPTIONS.map(([value, label]) => `
          <option value="${value}" ${tile.size === value ? "selected" : ""}>${label}</option>
        `).join("");

        return `
          <article class="dashboard-tile" data-tile-id="${tile.id}" data-size="${tile.size}" aria-label="${definition.label} tile">
            <div class="tile-edit-controls">
              <select class="tile-size-select" data-size-control aria-label="Resize ${definition.label}">
                ${sizeOptions}
              </select>
              <button class="tile-control danger" type="button" data-action="remove-tile" title="Remove ${definition.label}" aria-label="Remove ${definition.label}">
                ${ICON("close")}
              </button>
            </div>
            ${definition.render()}
          </article>
        `;
      }

      updateControlState() {
        const disabled = !this.editing;
        this.querySelectorAll(".tile-edit-controls button, .tile-edit-controls select").forEach((control) => {
          control.disabled = disabled;
        });
      }

      resizeCharts() {
        requestAnimationFrame(() => {
          this.querySelectorAll("viam-chart-card").forEach((chart) => chart.resizeChart?.());
          window.dispatchEvent(new Event("resize"));
        });
      }
    }

    class ViamDashboard extends HTMLElement {
      connectedCallback() {
        this.innerHTML = `
          <main class="app-shell">
            <header class="topbar">
              <div class="brand-mark" aria-label="Viam reference mark">V</div>
              <div class="brand-meta">
                <strong>Viam Reference Ops</strong>
                <small>Dark mission-control skeleton</small>
              </div>
              <span class="status-pill">${ICON("radio_button_checked")} Mesh nominal</span>
              <div class="topbar-spacer"></div>
              <label class="search">
                ${ICON("search")}
                <input type="search" value="" placeholder="Search machines">
              </label>
              <button class="icon-button" type="button" title="Notifications" aria-label="Notifications">
                ${ICON("notifications")}
              </button>
              <button class="icon-button" type="button" title="Settings" aria-label="Settings">
                ${ICON("settings")}
              </button>
            </header>

            <nav class="rail" aria-label="Primary navigation">
              <button class="rail-button active" type="button" title="Dashboard" aria-label="Dashboard">${ICON("space_dashboard")}</button>
              <button class="rail-button" type="button" title="Fleet" aria-label="Fleet">${ICON("precision_manufacturing")}</button>
              <button class="rail-button" type="button" title="Telemetry" aria-label="Telemetry">${ICON("monitoring")}</button>
              <button class="rail-button" type="button" title="Commands" aria-label="Commands">${ICON("terminal")}</button>
              <button class="rail-button" type="button" title="Integrations" aria-label="Integrations">${ICON("hub")}</button>
            </nav>

            <section class="content">
              <div class="dashboard-frame">
                <div class="section-bar">
                  <div class="section-title">
                    <strong>Machine Operations</strong>
                    <span>Viam-inspired white-label robotics telemetry and command console</span>
                  </div>
                  <div class="section-actions">
                    <div class="segmented" role="group" aria-label="Tenant view">
                      <button class="segment active" type="button">Base</button>
                      <button class="segment" type="button">Logistics</button>
                      <button class="segment" type="button">Field</button>
                    </div>
                    <label class="edit-toggle">
                      <input type="checkbox" data-edit-toggle aria-label="Edit dashboard layout">
                      <span class="switch-track" aria-hidden="true"></span>
                      <span>Edit</span>
                    </label>
                    <form class="tile-add-form" data-add-tile-form>
                      <select class="select-field" data-tile-picker aria-label="Available tiles">
                        ${TILE_CATALOG.map((tile) => `<option value="${tile.type}">${tile.label}</option>`).join("")}
                      </select>
                      <button class="filled-tonal" type="submit">
                        ${ICON("add")}
                        Add
                      </button>
                    </form>
                  </div>
                </div>

                <viam-tile-board></viam-tile-board>
              </div>
            </section>
          </main>
        `;

        this.bindEditor();
      }

      bindEditor() {
        const frame = this.querySelector(".dashboard-frame");
        const board = this.querySelector("viam-tile-board");
        const editToggle = this.querySelector("[data-edit-toggle]");
        const addForm = this.querySelector("[data-add-tile-form]");
        const tilePicker = this.querySelector("[data-tile-picker]");
        const addControls = addForm.querySelectorAll("button, select");

        const syncEditState = () => {
          const editing = editToggle.checked;
          frame.dataset.editing = String(editing);
          board.editing = editing;
          addControls.forEach((control) => {
            control.disabled = !editing;
          });
        };

        editToggle.addEventListener("change", syncEditState);
        addForm.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!editToggle.checked) {
            return;
          }

          board.addTile(tilePicker.value);
        });

        syncEditState();
      }
    }

    customElements.define("viam-metric-card", ViamMetricCard);
    customElements.define("viam-chart-card", ViamChartCard);
    customElements.define("viam-fleet-table", ViamFleetTable);
    customElements.define("viam-command-center", ViamCommandCenter);
    customElements.define("viam-site-map", ViamSiteMap);
    customElements.define("viam-event-stream", ViamEventStream);
    customElements.define("viam-tile-board", ViamTileBoard);
    customElements.define("viam-dashboard", ViamDashboard);
  </script>
</body>
</html>
